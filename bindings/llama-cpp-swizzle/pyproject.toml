[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-cpp-swizzle"
version = "0.1.0"
description = "Runs code written for llama-cpp-python on Swizzle Runtime, unchanged"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Swizzle AI" }]
dependencies = ["swizzle-engine"]

[project.urls]
Source = "https://github.com/Swizzle-AI/swizzle-runtime"

[tool.setuptools]
py-modules = ["llama_cpp_swizzle"]
