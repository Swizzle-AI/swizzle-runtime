[book]
title = "Swizzle Runtime"
description = "Open engine for running AI locally. Runs your GGUF models today, and .ktc models verified and tuned for your hardware."
authors = ["Swizzle AI"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/Swizzle-AI/swizzle-runtime"
edit-url-template = "https://github.com/Swizzle-AI/swizzle-runtime/edit/main/docs/{path}"
site-url = "/swizzle/"
no-section-label = true
default-theme = "coal"
preferred-dark-theme = "coal"
additional-css = ["theme/swizzle.css", "theme/narrow.css"]
additional-js = ["theme/search.js"]

[output.html.search]
enable = true
