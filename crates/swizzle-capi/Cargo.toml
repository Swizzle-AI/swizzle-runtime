[package]
name = "swizzle-capi"
description = "C API for Swizzle: load a model, chat with it and embed text from any language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# `swizzle` alone would share swizzle.pdb with the command-line tool on Windows.
name = "swizzle_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
swizzle = { path = "../swizzle" }
