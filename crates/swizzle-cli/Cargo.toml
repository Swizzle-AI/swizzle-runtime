[package]
name = "swizzle-cli"
description = "Swizzle Runtime (swizzle-rt) — high-throughput local LLM inference engine CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "swizzle-rt"
path = "src/main.rs"

[features]
default = ["cuda", "vulkan"]
# Runs models on NVIDIA GPUs; the kernels are built when nvcc is found. The
# driver itself is opened at runtime, so the binary still starts, on the
# CPU, on machines without one.
cuda = ["swizzle-server/cuda", "dep:swizzle-cuda"]
# Runs models on AMD, Intel and NVIDIA GPUs through Vulkan. The kernels are
# compiled to SPIR-V at build time and the loader is opened at runtime, so
# this needs no SDK to build and no driver to start.
vulkan = ["swizzle-server/vulkan", "dep:swizzle-vulkan"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
swizzle-cuda = { path = "../swizzle-cuda", optional = true }
swizzle-gguf = { path = "../swizzle-gguf" }
swizzle-ktc = { path = "../swizzle-ktc" }
swizzle-models = { path = "../swizzle-models" }
swizzle-quant = { path = "../swizzle-quant" }
swizzle-server = { path = "../swizzle-server" }
swizzle-tokenizer = { path = "../swizzle-tokenizer" }
swizzle-vision = { path = "../swizzle-vision" }
swizzle-vulkan = { path = "../swizzle-vulkan", optional = true }
rayon.workspace = true
rustyline = { version = "19.0.0", default-features = false }
serde_json = "1.0.149"
sha2 = "0.10.9"
strsim = "0.11.1"
unicode-width = "0.2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
