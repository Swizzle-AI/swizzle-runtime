[package]
name = "swizzle"
description = "Run local GGUF and .ktc language models from Rust: generate, chat and embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["cuda"]
# Runs text models on NVIDIA GPUs that can take them; see swizzle-cli.
cuda = ["swizzle-server/cuda"]

[dependencies]
swizzle-gguf = { path = "../swizzle-gguf" }
swizzle-ktc = { path = "../swizzle-ktc" }
swizzle-models = { path = "../swizzle-models" }
swizzle-server = { path = "../swizzle-server" }
swizzle-tokenizer = { path = "../swizzle-tokenizer" }
serde_json = "1.0.149"
