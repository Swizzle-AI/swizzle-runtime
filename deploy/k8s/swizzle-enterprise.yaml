apiVersion: apps/v1
kind: Deployment
metadata:
  name: swizzle-runtime-enterprise
  labels:
    app.kubernetes.io/name: swizzle-runtime
    app.kubernetes.io/component: inference-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: swizzle-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swizzle-runtime
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: swizzle-rt
          image: ghcr.io/swizzle-ai/swizzle-runtime:latest
          args:
            - "serve"
            - "/models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "24Gi"
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: "16Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: swizzle-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: swizzle-runtime
  labels:
    app.kubernetes.io/name: swizzle-runtime
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: swizzle-runtime
